<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BPP Workspace - Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">

        darkMode: "class",

                    "primary-fixed": "#e4e2e1",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#1b1c19",
                    "surface-container": "#efeded",
                    "on-primary-fixed-variant": "#474747",
                    "secondary-fixed-dim": "#c8c6c2",
                    "on-error": "#ffffff",
                    "inverse-surface": "#2f3031",
                    "surface-container-low": "#f4f3f3",
                    "on-background": "#1b1c1c",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f2f0f0",
                    "on-tertiary-fixed": "#261a00",
                    "tertiary-container": "#3c2a00",
                    "on-surface-variant": "#444748",
                    "secondary-fixed": "#e4e2dd",
                    "surface-dim": "#dbdad9",
                    "primary": "#181919",
                    "secondary-container": "#e1dfdb",
                    "tertiary": "#221700",
                    "tertiary-fixed": "#ffdfa0",
                    "tertiary-fixed-dim": "#fbbc00",
                    "primary-container": "#2d2d2d",
                    "error": "#ba1a1a",
                    "on-surface": "#1b1c1c",
                    "surface": "#faf9f9",
                    "on-secondary-container": "#63635f",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#bd8d00",
                    "background": "#faf9f9",
                    "surface-variant": "#e3e2e2",
                    "surface-tint": "#5f5e5e",
                    "on-secondary-fixed-variant": "#474744",
                    "on-tertiary-fixed-variant": "#5c4300",
                    "secondary": "#5e5e5b",
                    "surface-bright": "#faf9f9",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#c8c6c6",
                    "surface-container-highest": "#e3e2e2",
                    "surface-container-high": "#e9e8e8",
                    "outline": "#747878"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "margin-desktop": "48px",
                    "margin-mobile": "16px",
                    "gutter": "24px",
                    "stack-md": "16px",
                    "unit": "4px",
                    "stack-lg": "32px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "body-sm": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "label-caps": ["JetBrains Mono"],

                    "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "-0.01em", "fontWeight": "400" }]
            }
          }
        }
      }

<style>
        /* Ambient animation for background */
        @keyframes ambient-drift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            33% { transform: translate(30px, -50px) scale(1.05); opacity: 0.5; }
            66% { transform: translate(-20px, 20px) scale(0.95); opacity: 0.4; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        }

        .ambient-shape {
            position: absolute;
            filter: blur(80px);
            border-radius: 50%;
            animation: ambient-drift 20s infinite ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(228, 226, 221, 0.4); /* secondary-fixed */
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: rgba(239, 237, 237, 0.5); /* surface-container */
            bottom: -150px;
            right: -150px;
            animation-delay: -10s;
        }

        /* Tactile Paper Texture */
        .paper-texture {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.4;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
        }

        /* Ambient Shadows */
        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(74, 63, 53, 0.08);
        }
    </style>
</head>
<body class="bg-surface text-primary min-h-screen w-full flex items-center justify-center relative overflow-hidden font-body-lg">
<!-- Animated Abstract Background -->
<div class="ambient-shape shape-1"></div>
<div class="ambient-shape shape-2"></div>
<!-- SVG Noise Paper Texture Overlay -->
<!-- Used a minimal base64 in CSS above just for noise, as instructed by general web dev practices for noise, 
         but adhering to the "no large base64 rule", this is an ultra-tiny inline SVG strictly for the texture effect 
         that defines the "Tactile" aspect of the brand. -->
<div class="paper-texture"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[420px] px-margin-mobile md:px-0">
<!-- Login Card -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl border border-outline-variant rounded-xl p-stack-lg ambient-shadow">
<!-- Monogram Header -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-stack-md">
<span class="font-display text-display text-on-primary leading-none mt-1">B</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-unit">BPP Workspace</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure Enterprise Access</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">mail</span>
<input class="w-full h-12 rounded-xl bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none pl-10 pr-4 font-body-lg text-body-lg text-primary placeholder:text-outline transition-all" id="email" placeholder="name@bhaskar.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-baseline">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">lock</span>
<input class="w-full h-12 rounded-xl bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none pl-10 pr-4 font-body-lg text-body-lg text-primary placeholder:text-outline transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Action -->
<button class="mt-stack-sm w-full h-12 rounded-xl bg-primary text-on-primary font-headline-md text-body-lg hover:bg-inverse-surface active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Enter Workspace
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Meta -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant/70">
                © 2024 Bhaskar Paper Products. All rights reserved.
            </p>
</div>
</main>
</body></html>
